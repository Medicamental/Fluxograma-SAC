<title>Processos do SAC — Central de Consulta</title>
<style>
  :root{
    --bg:#0a0d13;
    --bg-panel:#0e1219;
    --surface:#12161f;
    --surface-2:#161b25;
    --surface-3:#1b2130;
    --border:rgba(255,255,255,.08);
    --border-soft:rgba(255,255,255,.05);
    --text:#e8eaf0;
    --text-dim:#a7adba;
    --text-faint:#5c6577;
    --accent:#4d8dff;
    --accent-soft:rgba(77,141,255,.12);
    --accent-line:rgba(77,141,255,.35);
    --amber:#d9a94f;
    --amber-soft:rgba(217,169,79,.12);
    --violet:#9b8cf2;
    --violet-soft:rgba(155,140,242,.12);
    --green:#49c99a;
    --green-soft:rgba(73,201,154,.12);
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:16px;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 8px 24px -8px rgba(0,0,0,.5);
    --shadow-3:0 20px 48px -16px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    overflow:hidden;
    font-size:14px;
  }
  button{font-family:inherit;}
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ============ HEADER ============ */
  .topbar{
    flex:none;height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg-panel);
    z-index:30;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:13px;
  }
  .brand h1{font-size:15px;font-weight:600;letter-spacing:-.005em;line-height:1.1;margin:0;}
  .brand .sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .env-tag{
    font-size:11px;color:var(--text-faint);border:1px solid var(--border);border-radius:100px;
    padding:4px 10px;letter-spacing:.03em;
  }

  /* ============ LAYOUT ============ */
  .body-row{flex:1;display:flex;min-height:0;}

  /* ============ SIDEBAR ============ */
  .sidebar{
    flex:none;width:264px;border-right:1px solid var(--border);background:var(--bg-panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .search-box{padding:16px 16px 12px;flex:none;position:relative;}
  .search-box input{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:9px 12px 9px 34px;color:var(--text);font-size:13px;outline:none;
    transition:border-color .15s, background .15s;
  }
  .search-box input::placeholder{color:var(--text-faint);}
  .search-box input:focus{border-color:var(--accent-line);background:var(--surface-2);}
  .search-box svg{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;}

  .search-results{
    position:absolute;left:16px;right:16px;top:100%;margin-top:4px;
    background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-m);
    box-shadow:var(--shadow-3);z-index:40;max-height:320px;overflow-y:auto;display:none;
  }
  .search-results.show{display:block;}
  .search-results .sr-item{
    all:unset;display:block;width:100%;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border-soft);
  }
  .search-results .sr-item:last-child{border-bottom:none;}
  .search-results .sr-item:hover{background:var(--surface-2);}
  .sr-item .sr-title{font-size:13px;font-weight:600;color:var(--text);}
  .sr-item .sr-meta{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .search-results .sr-empty{padding:16px 14px;font-size:12.5px;color:var(--text-faint);}

  .nav-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);
    padding:14px 20px 8px;flex:none;
  }
  .nav-list{flex:1;overflow-y:auto;padding:0 10px 10px;}
  .nav-item{
    all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--radius-s);
    cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:500;margin-bottom:2px;
    transition:background .15s, color .15s;
  }
  .nav-item:hover{background:var(--surface);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--text);}
  .nav-item .ni-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:none;}
  .nav-item.active .ni-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .nav-item .ni-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-item .ni-count{font-size:10.5px;color:var(--text-faint);font-family:ui-monospace,monospace;}
  .nav-item.catalog .ni-dot{background:var(--violet);border-radius:2px;}

  .sidebar-foot{flex:none;padding:14px 20px;border-top:1px solid var(--border);}
  .legend{display:flex;flex-direction:column;gap:7px;}
  .legend .lg-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);margin-bottom:4px;}
  .legend .lg-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-dim);}
  .legend .lg-mark{width:12px;height:12px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-faint);}

  /* ============ MAIN ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;}

  .crumbbar{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 24px;border-bottom:1px solid var(--border);
  }
  .breadcrumb{font-size:12.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .breadcrumb b{color:var(--text-dim);font-weight:600;}
  .breadcrumb .sep{color:var(--text-faint);opacity:.6;}
  .breadcrumb .current{color:var(--text);font-weight:600;}

  .toolbar{display:flex;align-items:center;gap:6px;flex:none;}
  .tbtn{
    all:unset;width:30px;height:30px;border-radius:var(--radius-s);display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);border:1px solid var(--border);background:var(--surface);cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .tbtn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border);}
  .tbtn.wide{width:auto;padding:0 12px;font-size:12px;font-weight:600;gap:6px;}
  .zoom-pct{font-size:11.5px;color:var(--text-faint);font-family:ui-monospace,monospace;width:42px;text-align:center;}

  /* ============ CANVAS ============ */
  .canvas-viewport{
    flex:1;position:relative;overflow:hidden;min-height:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.045) 1px, transparent 1.6px) 0 0/28px 28px;
    cursor:grab;
  }
  .canvas-viewport.grabbing{cursor:grabbing;}
  .canvas-surface{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  svg.connectors{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
  svg.connectors path{
    fill:none;stroke:var(--border);stroke-width:1.6;transition:stroke .15s, stroke-width .15s, opacity .15s;
  }
  svg.connectors path.hl{stroke:var(--accent);stroke-width:2.2;}
  svg.connectors path.dim{opacity:.25;}
  svg.connectors marker path{stroke:none;}

  .edge-label{
    position:absolute;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:100px;
    background:var(--bg-panel);border:1px solid var(--border);color:var(--text-faint);transform:translate(-50%,-50%);
    white-space:nowrap;transition:opacity .15s;
  }
  .edge-label.yes{color:var(--green);border-color:rgba(73,201,154,.35);}
  .edge-label.no{color:var(--text-dim);}
  .edge-label.dim{opacity:.35;}

  .node{
    position:absolute;transition:box-shadow .15s, border-color .15s, opacity .15s, transform .15s;
  }
  .node.dim{opacity:.32;}

  .card{
    all:unset;display:block;width:100%;height:100%;cursor:pointer;text-align:left;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:14px 16px;box-shadow:var(--shadow-1);position:relative;
    transition:border-color .15s, box-shadow .15s, transform .15s, background .15s;
  }
  .card:hover{border-color:var(--border); background:var(--surface-2); box-shadow:var(--shadow-2); transform:translateY(-1px);}
  .node.selected .card{border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-2);}

  .card .c-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .card .c-icon{
    width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--surface-3);color:var(--text-faint);
  }
  .card .c-idx{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-faint);}
  .card .c-title{font-size:13px;font-weight:700;line-height:1.3;letter-spacing:-.005em;margin-bottom:5px;}
  .card .c-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;}
  .card .c-tag{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);border:1px solid var(--border);
    border-radius:100px;padding:2px 8px;
  }

  .node.start .card{border-left:2px solid var(--accent);}
  .node.start .c-icon{color:var(--accent);}
  .node.end .card{border-left:2px solid var(--green);}
  .node.end .c-icon{color:var(--green);}
  .node.redirect .card{border-left:2px solid var(--violet);}
  .node.redirect .c-icon{color:var(--violet);}
  .node.step .card{border-left:2px solid var(--border);}

  .node.decision .card{
    background:var(--surface); border-radius:var(--radius-m); border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 20px;
  }
  .node.decision .diamond-bg{
    position:absolute;inset:8px;background:var(--surface-2);border:1px solid rgba(217,169,79,.35);
    transform:rotate(45deg);border-radius:6px;z-index:0;
  }
  .node.decision .d-content{position:relative;z-index:1;}
  .node.decision .c-icon{margin:0 auto 8px;color:var(--amber);background:var(--amber-soft);}
  .node.decision .c-title{font-size:12.5px;font-weight:700;line-height:1.35;}
  .node.decision:hover .card{border-color:rgba(217,169,79,.4);}
  .node.decision.selected .card{box-shadow:0 0 0 3px var(--amber-soft);}

  .node.start .card, .node.end .card{
    display:flex;align-items:center;gap:10px;border-radius:100px;padding:10px 18px;
  }
  .node.start .c-title, .node.end .c-title{font-size:12.5px;margin:0;}
  .node.start .c-desc, .node.end .c-desc{display:none;}
  .node.start .c-top, .node.end .c-top{margin:0;}

  /* ============ CATALOG VIEW (motivos de devolução) ============ */
  .catalog-view{flex:1;overflow-y:auto;padding:28px 32px 60px;display:none;}
  .catalog-view.show{display:block;}
  .catalog-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1000px;}
  .cgroup{border:1px solid var(--border);border-radius:var(--radius-l);background:var(--surface);padding:18px 18px 14px;}
  .cgroup h3{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text-dim);}
  .cgroup .clist{display:flex;flex-wrap:wrap;gap:8px;}
  .cchip{
    all:unset;cursor:pointer;font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:100px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    transition:border-color .15s, color .15s;
  }
  .cchip:hover{border-color:var(--accent-line);color:var(--text);}
  .cchip.sel{border-color:var(--accent-line);color:var(--text);background:var(--accent-soft);}
  .catalog-detail{
    margin-top:20px;max-width:1000px;border:1px solid var(--border);border-radius:var(--radius-l);
    background:var(--surface);padding:20px 24px;
  }
  .catalog-detail h4{font-size:14.5px;font-weight:700;margin-bottom:8px;}
  .catalog-detail p{font-size:13px;color:var(--text-dim);line-height:1.6;max-width:70ch;}

  /* ============ EMPTY STATE ============ */
  .empty-state{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--text-faint);
  }
  .empty-state.show{display:flex;}
  .empty-state .es-icon{color:var(--text-faint);opacity:.6;}
  .empty-state .es-title{font-size:13px;font-weight:600;color:var(--text-dim);}
  .empty-state .es-sub{font-size:12px;}

  /* ============ SIDE PANEL ============ */
  .panel-overlay{
    position:absolute;inset:0;background:rgba(4,5,8,.35);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:35;
  }
  .panel-overlay.show{opacity:1;pointer-events:auto;}
  .side-panel{
    position:absolute;top:0;right:0;height:100%;width:380px;max-width:90vw;
    background:var(--bg-panel);border-left:1px solid var(--border);box-shadow:var(--shadow-3);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    z-index:36;display:flex;flex-direction:column;
  }
  .side-panel.open{transform:translateX(0);}
  .panel-head{
    flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:22px 22px 16px;border-bottom:1px solid var(--border);
  }
  .panel-head .ph-tag{
    display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:var(--text-faint);margin-bottom:8px;
  }
  .panel-head h2{font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-.005em;}
  .panel-close{
    all:unset;cursor:pointer;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    color:var(--text-faint);flex:none;transition:background .15s, color .15s;
  }
  .panel-close:hover{background:var(--surface); color:var(--text);}
  .panel-body{flex:1;overflow-y:auto;padding:20px 22px 40px;}
  .p-block{margin-bottom:22px;}
  .p-block .pb-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .p-block p{font-size:13px;line-height:1.65;color:var(--text-dim);}
  .p-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:7px 12px;
  }
  .p-doclist{display:flex;flex-direction:column;gap:6px;}
  .p-doclist li{list-style:none;font-size:12.5px;color:var(--text-dim);display:flex;gap:8px;align-items:flex-start;}
  .p-doclist li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--text-faint);margin-top:6px;flex:none;}
  .p-next{
    all:unset;display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 14px;
    transition:border-color .15s, background .15s;
  }
  .p-next:hover{border-color:var(--accent-line); background:var(--surface-2);}
  .p-next .pn-title{font-size:12.5px;font-weight:600;color:var(--text);}
  .p-next .pn-sub{font-size:10.5px;color:var(--text-faint);margin-top:2px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:1000px){
    .sidebar{width:220px;}
    .side-panel{width:340px;}
    .catalog-grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<div class="app">

  <!-- ===================== TOPBAR ===================== -->
  <header class="topbar">
    <div class="brand">
      <div class="mark">M</div>
      <div>
        <h1>Processos do SAC</h1>
        <div class="sub">Central de consulta e direcionamento dos fluxos de atendimento</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="env-tag">Uso interno · Medicamental</span>
    </div>
  </header>

  <div class="body-row">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar processo ou etapa...">
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="nav-label">Fluxos de atendimento</div>
      <nav class="nav-list" id="navList"></nav>

      <div class="sidebar-foot">
        <div class="legend">
          <div class="lg-title">Legenda</div>
          <div class="lg-row"><span class="lg-mark" style="color:var(--accent)">●</span> Início</div>
          <div class="lg-row"><span class="lg-mark">▮</span> Etapa</div>
          <div class="lg-row"><span class="lg-mark" style="color:var(--amber)">◆</span> Decisão</div>
          <div class="lg-row"><span class="lg-mark" style="color:var(--violet)">→</span> Direcionamento</div>
          <div class="lg-row"><span class="lg-mark" style="color:var(--green)">✓</span> Finalização</div>
        </div>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main">
      <div class="crumbbar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="toolbar" id="toolbar">
          <button class="tbtn" id="zoomOut" title="Reduzir zoom">−</button>
          <span class="zoom-pct" id="zoomPct">100%</span>
          <button class="tbtn" id="zoomIn" title="Aumentar zoom">+</button>
          <button class="tbtn wide" id="fitScreen" title="Ajustar à tela">Ajustar à tela</button>
          <button class="tbtn wide" id="centerFlow" title="Centralizar">Centralizar</button>
        </div>
      </div>

      <div class="canvas-viewport" id="viewport">
        <div class="canvas-surface" id="surface">
          <svg class="connectors" id="connectors"></svg>
          <div id="nodesLayer"></div>
        </div>
        <div class="empty-state" id="emptyState">
          <svg class="es-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
          <div class="es-title">Nenhuma etapa encontrada</div>
          <div class="es-sub">Ajuste os termos da busca ou selecione outro processo.</div>
        </div>
      </div>

      <div class="catalog-view" id="catalogView">
        <div class="catalog-grid" id="catalogGrid"></div>
        <div class="catalog-detail" id="catalogDetail"></div>
      </div>

      <div class="panel-overlay" id="panelOverlay"></div>
      <aside class="side-panel" id="sidePanel">
        <div class="panel-head">
          <div>
            <div class="ph-tag" id="panelTag">Etapa</div>
            <h2 id="panelTitle">—</h2>
          </div>
          <button class="panel-close" id="panelClose">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
          </button>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </aside>
    </main>
  </div>
</div>

<script>
(function(){

  /* =====================================================================
     CAMADA DE DADOS
     ---------------------------------------------------------------------
     Cada processo é um objeto independente da camada visual, no formato:
       { id, title, entry, nodes:[{id,type,title,desc,tag,owner,
         guidance,docs,prazo,col,row,next}], edges:[{from,to,side,label}] }
     tipos de nó: start | step | decision | redirect | end
     Os dados abaixo refletem os fluxos reais do Sac Medicamental
     ("Fluxo atual — Devolução e Portal do Cliente"). Para adicionar um
     novo processo, basta incluir um novo objeto neste array seguindo a
     mesma estrutura — nenhuma alteração de interface é necessária.
     ===================================================================== */

  const PROCESSES = [
    {
      id:"total", title:"Devolução total", entry:"Sac ou Portal do Cliente",
      nodes:[
        {id:"t1", type:"start", title:"Abertura da devolução", tag:"Abertura", owner:"Sac / Portal do Cliente",
         desc:"Cliente ou atendente formaliza a solicitação de devolução total do pedido.",
         guidance:"Confirme o número do pedido e o motivo da devolução antes de registrar a abertura.",
         prazo:"7 dias", col:0, row:0},
        {id:"t2", type:"step", title:"Emissão do espelho", tag:"Documentação", owner:"Sac / Portal do Cliente",

  /* =====================================================================
     LAYOUT — conversão de grid (col,row) em pixels
     ===================================================================== */
  const COL_W = 268, ROW_H = 172, PAD = 56;
  const SIZE = {
    start:{w:200,h:52}, end:{w:200,h:52}, step:{w:216,h:118}, redirect:{w:216,h:110}, decision:{w:190,h:190}
  };

  function layoutNodes(proc){
    proc.nodes.forEach(n=>{
      const s = SIZE[n.type];
      n.w = s.w; n.h = s.h;
      n.x = PAD + n.col*COL_W + (n.type==="decision" ? (216-s.w)/2 : 0);
      n.y = PAD + n.row*ROW_H;
    });
  }
  PROCESSES.forEach(layoutNodes);

  function anchor(n, side){
    switch(side){
      case "top": return {x:n.x+n.w/2, y:n.y};
      case "bottom": return {x:n.x+n.w/2, y:n.y+n.h};
      case "left": return {x:n.x, y:n.y+n.h/2};
      case "right": return {x:n.x+n.w, y:n.y+n.h/2};
    }
  }

      els.navList.appendChild(item);

      const p = currentProcess();
      els.breadcrumb.innerHTML = `<b>Processos do SAC</b><span class="sep">/</span>${p.title}<span class="sep">/</span><span class="current">Fluxo principal</span>`;

  /* =====================================================================
     RENDER DO FLUXO
     ===================================================================== */
  function renderFlow(){
    const proc = currentProcess();
    els.nodesLayer.innerHTML = "";
    els.connectors.innerHTML = "";

    let maxX=0, maxY=0;
    proc.nodes.forEach(n=>{ maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); });
    const surfW = maxX+PAD, surfH = maxY+PAD;
    els.surface.style.width = surfW+"px";
    els.surface.style.height = surfH+"px";
    els.connectors.setAttribute("width", surfW);
    els.connectors.setAttribute("height", surfH);
    els.connectors.setAttribute("viewBox", `0 0 ${surfW} ${surfH}`);

    // conectores
    proc.edges.forEach(e=>{
      const from = proc.nodes.find(n=>n.id===e.from);
      const to = proc.nodes.find(n=>n.id===e.to);
      const fromSide = e.side || "bottom";
      const toSide = fromSide==="right" ? "left" : "top";
      const a = anchor(from, fromSide), b = anchor(to, toSide);
      let d;
      if(fromSide==="right"){
        const dx = Math.max(40, (b.x-a.x)/2);
        d = `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
      } else {
        const dy = Math.max(40, (b.y-a.y)/2);
        d = `M ${a.x} ${a.y} C ${a.x} ${a.y+dy}, ${b.x} ${b.y-dy}, ${b.x} ${b.y}`;
      }
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d", d);
      path.dataset.from = e.from; path.dataset.to = e.to;
      els.connectors.appendChild(path);

      if(e.label){
        const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
        const lbl = document.createElement("div");
        lbl.className = "edge-label " + (e.label==="SIM" ? "yes" : "no");
        lbl.textContent = e.label;
        lbl.style.left = mid.x+"px";
        lbl.style.top = mid.y+"px";
        lbl.dataset.from = e.from; lbl.dataset.to = e.to;
        els.nodesLayer.appendChild(lbl);
      }
    });

    // nós
    proc.nodes.forEach((n, idx)=>{
      const wrap = document.createElement("div");
      wrap.className = "node " + n.type;
      wrap.style.left = n.x+"px"; wrap.style.top = n.y+"px";
      wrap.style.width = n.w+"px"; wrap.style.height = n.h+"px";
      wrap.dataset.id = n.id;

      const idxLabel = n.type==="step" || n.type==="redirect" ? `<span class="c-idx">${String(idx+1).padStart(2,"0")}</span>` : "";

      if(n.type==="decision"){
        wrap.innerHTML = `
          <div class="card">
            <div class="diamond-bg"></div>
            <div class="d-content">
              <div class="c-icon">${ICONS.decision}</div>
              <div class="c-title">${n.title}</div>
            </div>
          </div>`;
      } else if(n.type==="start" || n.type==="end"){
        wrap.innerHTML = `
          <button class="card">
            <div class="c-icon">${ICONS[n.type]}</div>
            <div class="c-title">${n.title}</div>
          </button>`;
      } else {
        wrap.innerHTML = `
          <button class="card">
            <div class="c-top">${idxLabel}<div class="c-icon">${ICONS[n.type]}</div></div>
            <div class="c-title">${n.title}</div>
            <div class="c-desc">${n.desc}</div>
            <div class="c-tag">${n.tag}</div>
          </button>`;
      }

      wrap.addEventListener("click", ()=> openPanel(n));
      wrap.addEventListener("mouseenter", ()=> highlight(n.id));
      wrap.addEventListener("mouseleave", clearHighlight);
      els.nodesLayer.appendChild(wrap);
    });

    if(state.selectedNode){
      const el = els.nodesLayer.querySelector(`.node[data-id="${state.selectedNode}"]`);
      if(el) el.classList.add("selected");
    }
  }

  function highlight(id){
    const paths = els.connectors.querySelectorAll("path");
    const labels = els.nodesLayer.querySelectorAll(".edge-label");
    const nodes = els.nodesLayer.querySelectorAll(".node");
    let connected = new Set([id]);
    paths.forEach(p=>{ if(p.dataset.from===id || p.dataset.to===id){ p.classList.add("hl"); connected.add(p.dataset.from); connected.add(p.dataset.to); } else p.classList.add("dim"); });
    labels.forEach(l=>{ if(l.dataset.from===id || l.dataset.to===id) l.classList.remove("dim"); else l.classList.add("dim"); });
    nodes.forEach(n=>{ if(!connected.has(n.dataset.id)) n.classList.add("dim"); });
  }
  function clearHighlight(){
    els.connectors.querySelectorAll("path").forEach(p=>p.classList.remove("hl","dim"));
    els.nodesLayer.querySelectorAll(".edge-label").forEach(l=>l.classList.remove("dim"));
    els.nodesLayer.querySelectorAll(".node").forEach(n=>n.classList.remove("dim"));
  }

  /* =====================================================================
     PAN & ZOOM
     ===================================================================== */
  function applyTransform(){
    els.surface.style.transform = `translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;
    els.zoomPct.textContent = Math.round(state.scale*100)+"%";
  }

  function fitToScreen(animateFrom){
    const proc = currentProcess();
    if(!proc.nodes.length) return;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    proc.nodes.forEach(n=>{ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); });
    const vp = els.viewport.getBoundingClientRect();
    const contentW = (maxX-minX)+PAD*2, contentH = (maxY-minY)+PAD*2;
    let scale = Math.min(vp.width/contentW, vp.height/contentH, 1.05);
    scale = Math.max(0.35, scale);
    state.scale = scale;
    state.tx = (vp.width - (maxX-minX)*scale)/2 - minX*scale;
    state.ty = (vp.height - (maxY-minY)*scale)/2 - minY*scale;
    applyTransform();
  }

  let dragging=false, dragStart={x:0,y:0}, startTxTy={x:0,y:0};
  els.viewport.addEventListener("pointerdown", (e)=>{
    if(e.target.closest(".node")) return;
    dragging = true;
    els.viewport.classList.add("grabbing");
    dragStart = {x:e.clientX, y:e.clientY};
    startTxTy = {x:state.tx, y:state.ty};
    els.viewport.setPointerCapture(e.pointerId);
  });
  els.viewport.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    state.tx = startTxTy.x + (e.clientX-dragStart.x);
    state.ty = startTxTy.y + (e.clientY-dragStart.y);
    applyTransform();
  });
  els.viewport.addEventListener("pointerup", (e)=>{
    dragging=false; els.viewport.classList.remove("grabbing");
    try{ els.viewport.releasePointerCapture(e.pointerId); }catch(err){}
  });

  function zoomBy(factor){
    const vp = els.viewport.getBoundingClientRect();
    const cx = vp.width/2, cy = vp.height/2;
    const contentX = (cx-state.tx)/state.scale, contentY = (cy-state.ty)/state.scale;
    state.scale = Math.max(0.35, Math.min(1.8, state.scale*factor));
    state.tx = cx - contentX*state.scale;
    state.ty = cy - contentY*state.scale;
    applyTransform();
  }
  document.getElementById("zoomIn").addEventListener("click", ()=> zoomBy(1.18));
  document.getElementById("zoomOut").addEventListener("click", ()=> zoomBy(1/1.18));
  document.getElementById("fitScreen").addEventListener("click", ()=> fitToScreen());
  document.getElementById("centerFlow").addEventListener("click", ()=> fitToScreen());

  /* =====================================================================
     PAINEL LATERAL
     ===================================================================== */
  function openPanel(n){
    state.selectedNode = n.id;
    renderFlow();

    const TAG_LABEL = {start:"Início", step:"Etapa", decision:"Decisão", redirect:"Direcionamento", end:"Finalização"};
    els.panelTag.textContent = TAG_LABEL[n.type];
    els.panelTitle.textContent = n.title;

    const proc = currentProcess();
    const outgoing = proc.edges.filter(e=>e.from===n.id);

    let html = `<div class="p-block"><div class="pb-label">Descrição</div><p>${n.desc}</p></div>`;
    if(n.owner) html += `<div class="p-block"><div class="pb-label">Responsável</div><span class="p-badge">${n.owner}</span></div>`;
    if(n.guidance) html += `<div class="p-block"><div class="pb-label">Orientação</div><p>${n.guidance}</p></div>`;
    if(n.docs && n.docs.length) html += `<div class="p-block"><div class="pb-label">Documentos necessários</div><ul class="p-doclist">${n.docs.map(d=>`<li>${d}</li>`).join("")}</ul></div>`;
    if(n.prazo) html += `<div class="p-block"><div class="pb-label">Prazo</div><span class="p-badge">${n.prazo}</span></div>`;
    if(outgoing.length){
      html += `<div class="p-block"><div class="pb-label">Próxima etapa</div><div style="display:flex;flex-direction:column;gap:8px;">`;
      outgoing.forEach(e=>{
        const target = proc.nodes.find(x=>x.id===e.to);
        html += `<button class="p-next" data-next="${target.id}"><span><span class="pn-title">${target.title}</span><span class="pn-sub">${e.label ? e.label+" · " : ""}${TAG_LABEL[target.type]}</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13,6 19,12 13,18"/></svg></button>`;
      });
      html += `</div></div>`;
    }
    els.panelBody.innerHTML = html;
    els.panelBody.querySelectorAll(".p-next").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const target = proc.nodes.find(x=>x.id===btn.dataset.next);
        openPanel(target);
      });
    });

    els.sidePanel.classList.add("open");
    els.panelOverlay.classList.add("show");
  }
  function closePanel(){
    els.sidePanel.classList.remove("open");
    els.panelOverlay.classList.remove("show");
    state.selectedNode = null;
    renderFlow();
  }
  document.getElementById("panelClose").addEventListener("click", closePanel);
  els.panelOverlay.addEventListener("click", closePanel);

  /* =====================================================================
     CATÁLOGO — MOTIVOS DE DEVOLUÇÃO
     ===================================================================== */
  let flatReasons = [];
  REASON_GROUPS.forEach(g=> g.items.forEach(it=> flatReasons.push({group:g.title, title:it[0], text:it[1]})));

  function renderCatalog(){
    els.catalogGrid.innerHTML = "";
    REASON_GROUPS.forEach(g=>{
      const card = document.createElement("div");
      card.className = "cgroup";
      card.innerHTML = `<h3>${g.title}</h3><div class="clist"></div>`;
      const list = card.querySelector(".clist");
      g.items.forEach(([title])=>{
        const idx = flatReasons.findIndex(f=>f.title===title);
        const chip = document.createElement("button");
        chip.className = "cchip";
        chip.dataset.idx = idx;
        chip.textContent = title;
        chip.addEventListener("click", ()=> showReason(idx));
        list.appendChild(chip);
      });
      els.catalogGrid.appendChild(card);
    });
    showReason(state.selectedReasonIdx);
  }
  function showReason(idx){
    state.selectedReasonIdx = idx;
    document.querySelectorAll(".cchip").forEach(c=> c.classList.toggle("sel", +c.dataset.idx===idx));
    const r = flatReasons[idx];
    els.catalogDetail.innerHTML = `<h4>${r.title}</h4><p>${r.text}</p>`;
  }

  function showCatalog(){
    state.view = "catalog";
    closePanel();
    els.catalogView.classList.add("show");
    els.viewport.style.display = "none";
    els.toolbar.style.display = "none";
    renderNav(); updateBreadcrumb(); renderCatalog();
  }
  function showFlow(){
    state.view = "flow";
    els.catalogView.classList.remove("show");
    els.viewport.style.display = "";
    els.toolbar.style.display = "";
  }

  function selectProcess(id, opts){
    opts = opts || {};
    state.processId = id;
    if(state.view!=="flow") showFlow();
    closePanel();
    renderNav(); updateBreadcrumb(); renderFlow();
    requestAnimationFrame(()=> fitToScreen());
    if(opts.openNode){
      const proc = currentProcess();
      const n = proc.nodes.find(x=>x.id===opts.openNode);
      if(n) setTimeout(()=> openPanel(n), 260);
    }
  }

  /* =====================================================================
     BUSCA
     ===================================================================== */
  let searchIndex = [];
  PROCESSES.forEach(p=> p.nodes.forEach(n=> searchIndex.push({processId:p.id, processTitle:p.title, nodeId:n.id, title:n.title, desc:n.desc})));

  els.searchInput.addEventListener("input", (e)=>{
    const q = e.target.value.trim().toLowerCase();
    if(q.length < 2){ els.searchResults.classList.remove("show"); return; }
    const matches = searchIndex.filter(it =>
      it.title.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q) || it.processTitle.toLowerCase().includes(q)
    ).slice(0,8);
    if(!matches.length){
      els.searchResults.innerHTML = `<div class="sr-empty">Nenhum resultado para "${e.target.value}"</div>`;
    } else {
      els.searchResults.innerHTML = matches.map(m=>
        `<button class="sr-item" data-pid="${m.processId}" data-nid="${m.nodeId}">
           <div class="sr-title">${m.title}</div>
           <div class="sr-meta">${m.processTitle}</div>
         </button>`
      ).join("");
      els.searchResults.querySelectorAll(".sr-item").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          selectProcess(btn.dataset.pid, {openNode:btn.dataset.nid});
          els.searchResults.classList.remove("show");
          els.searchInput.value = "";
        });
      });
    }
    els.searchResults.classList.add("show");
  });
  document.addEventListener("click", (e)=>{
    if(!e.target.closest(".search-box")) els.searchResults.classList.remove("show");
  });

  /* =====================================================================
     INIT
     ===================================================================== */
  window.addEventListener("resize", ()=>{ if(state.view==="flow") fitToScreen(); });
  renderNav();
  updateBreadcrumb();
  renderFlow();
  requestAnimationFrame(()=> fitToScreen());
})();
</script>
